# Naast de compose.yml van Plausible draaien:
#   docker compose -f compose.yml -f compose.caddy.yml up -d
services:
  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - plausible

volumes:
  caddy_data:
  caddy_config:
